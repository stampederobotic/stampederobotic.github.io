<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stampede joint — 3D view</title>
<meta name="description" content="Interactive 360° view of the Stampede joint actuator with an exploded-assembly slider.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{--ink:#16222C;--paper:#F4F1EA;--card:#FBF9F4;--line:#D9D3C4;--muted:#5B6670;--acc:#C9512B;--steel:#3F6A8A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#eef0f2 0%,#dcdfe2 55%,#cbcfd3 100%)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .ui{position:absolute;left:0;right:0;display:flex;gap:10px;align-items:center;padding:14px 16px;pointer-events:none}
  .ui > *{pointer-events:auto}
  .top{top:0;justify-content:space-between;flex-wrap:wrap}
  .bottom{bottom:0;background:linear-gradient(to top,rgba(203,207,211,.92),rgba(203,207,211,0));padding-top:28px}
  .seg{display:inline-flex;border:1px solid var(--line);background:rgba(251,249,244,.9);backdrop-filter:blur(6px);border-radius:999px;padding:3px}
  .seg button{appearance:none;border:0;background:transparent;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#ECE7DB}
  .chip{font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(251,249,244,.9);border:1px solid var(--line);border-radius:999px;padding:9px 12px;min-height:32px;display:flex;align-items:center;gap:8px}
  .chip b{color:var(--ink);font-weight:500}
  .slider{flex:1;display:flex;align-items:center;gap:12px;background:rgba(251,249,244,.92);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:220px}
  .slider label{font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  input[type=range]{flex:1;accent-color:var(--acc);height:28px;margin:0}
  .icon{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:rgba(251,249,244,.92);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .icon[aria-pressed="true"]{background:var(--ink);color:#ECE7DB}
  .icon svg{width:18px;height:18px}
  #load{position:absolute;inset:0;display:grid;place-items:center;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--muted);background:var(--paper);transition:opacity .4s}
  #load.hide{opacity:0;pointer-events:none}
  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--muted);background:rgba(251,249,244,.85);border:1px solid var(--line);border-radius:999px;padding:10px 14px;transition:opacity .5s}
  #hint.hide{opacity:0}
  @media (max-width:560px){.slider label span{display:none}.top{gap:8px}.chip.part{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="load">LOADING MODEL</div>
<div id="hint" class="hide">DRAG TO ORBIT · CLICK, THEN SCROLL TO ZOOM</div>

<div class="ui top">
  <div class="seg" role="group" aria-label="Size">
    <button data-size="s" aria-pressed="true">S · 56 mm</button>
    <button data-size="l" aria-pressed="false">L · 88 mm</button>
  </div>
  <div class="chip part" id="part"><span>PART</span><b id="partname">—</b></div>
</div>

<div class="ui bottom">
  <div class="slider">
    <label for="explode"><span>Assembled</span></label>
    <input id="explode" type="range" min="0" max="1" step="0.001" value="0" aria-label="Explode assembly">
    <label for="explode"><span>Exploded</span></label>
  </div>
  <button class="icon" id="spin" aria-pressed="true" title="Auto-rotate" aria-label="Toggle auto-rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <button class="icon" id="reset" title="Reset view" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h6v6"/><path d="M20 20h-6v-6"/><path d="M4 4l7 7"/><path d="M20 20l-7-7"/></svg></button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 1, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 0.7;
controls.minDistance = 60; controls.maxDistance = 1600;
controls.enableZoom = false;   // the wheel scrolls the page until the visitor clicks into the viewer

const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(180, 240, 200); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-220, 60, -160); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.35));

// subtle shadow disc under the part
const discTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 10, 128, 128, 128); grd.addColorStop(0, 'rgba(22,34,44,0.34)'); grd.addColorStop(1, 'rgba(22,34,44,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const disc = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: discTex, transparent: true, depthWrite: false }));
disc.rotation.x = -Math.PI / 2; scene.add(disc);

// ---- part groups along the actuator axis (z in the file), ordered rear -> output
const GROUPS = [
  ['rear_cover',      /^rear_cover/],
  ['driver board',    /^(driver_pcb|pcb_|rotor_encoder_ic)/],
  ['rear bulkhead',   /^(rear_bulkhead|rotor_bearing_rear)/],
  ['rotor',           /^(rotor_cup_shaft|rotor_back_iron|rotor_hub_shaft|magnet_|rotor_encoder_magnet)/],
  ['stator',          /^(stator_)/],
  ['housing',         /^housing_motor_alu/],
  ['front bulkhead',  /^(front_bulkhead|rotor_bearing_front)/],
  ['stage 1',         /^(stage1_)/],
  ['carrier 1',       /^carrier1_/],
  ['stage 2',         /^(stage2_)/],
  ['carrier 2',       /^carrier2_/],
  ['ring gear',       /^(ring_gear|housing_reducer_alu|front_ring_alu)/],
  ['output encoder',  /^output_encoder/],
  ['output',          /^(output_hub|cross_roller|front_seal)/],
];
const PRETTY = {
  rear_cover:'rear cover', driver_pcb:'driver board', pcb_mcu:'microcontroller', pcb_gate_driver:'gate driver', pcb_can_fd:'CAN-FD transceiver', pcb_buck:'buck regulator', pcb_bus_cap:'bus capacitor', pcb_connector:'connector',
  rotor_encoder_ic:'rotor encoder', rotor_encoder_magnet:'rotor encoder magnet', rear_bulkhead:'rear bulkhead', front_bulkhead:'front bulkhead', rotor_bearing_rear:'rotor bearing', rotor_bearing_front:'rotor bearing',
  stator_laminations:'stator laminations', stator_winding:'stator winding', stator_post:'stator post', rotor_cup_shaft:'rotor cup', rotor_back_iron:'rotor back iron', rotor_hub_shaft:'rotor hub',
  housing_motor_alu:'motor housing', housing_reducer_alu:'reducer housing', front_ring_alu:'front ring', ring_gear_spur:'ring gear', stage1_sun_spur:'sun gear, stage 1', carrier1_plate_B_sun2_spur:'carrier 1 and sun gear, stage 2',
  carrier2_plate_A:'carrier 2', carrier2_posts:'carrier posts', output_hub_flange:'output hub and flange', cross_roller_inner_ring:'cross-roller bearing, inner ring', cross_roller_outer_ring:'cross-roller bearing, outer ring', cross_roller_rollers:'cross rollers',
  output_encoder_ic:'output encoder', output_encoder_ring_magnet:'output encoder ring', front_seal:'front seal'
};
function prettyName(n) {
  if (PRETTY[n]) return PRETTY[n];
  if (/^magnet_/.test(n)) return 'rotor magnet';
  if (/^pcb_mosfet/.test(n)) return 'MOSFET';
  if (/^stage(\d)_planet/.test(n)) return 'planet gear, stage ' + n.match(/^stage(\d)/)[1];
  if (/^stage(\d)_pin/.test(n)) return 'planet pin, stage ' + n.match(/^stage(\d)/)[1];
  if (/^stage2_needles/.test(n)) return 'needle rollers';
  if (/^stage2_thrust/.test(n)) return 'thrust washer';
  return n.replace(/_/g, ' ');
}

const MODEL_EXT = 'glb';   // the artifact build switches this to 'json' (glTF with an embedded buffer)
// Finish palette, matched to the studio renders on the site: dark anodized housings, copper winding, steel gears, brass washers.
const LOOK = [
  [/^(stator_winding)/,                                                        { color: 0xc2651f, metalness: 0.85, roughness: 0.38 }],
  [/^(stator_laminations|stator_post|magnet_|rotor_back_iron)/,              { color: 0x22262b, metalness: 0.75, roughness: 0.50 }],
  [/^(driver_pcb)/,                                                            { color: 0x1b6a39, metalness: 0.10, roughness: 0.62 }],
  [/^(pcb_|rotor_encoder_ic|output_encoder_ic)/,                               { color: 0x15181c, metalness: 0.25, roughness: 0.50 }],
  [/^(rotor_encoder_magnet|output_encoder_ring_magnet)/,                       { color: 0x2c3036, metalness: 0.70, roughness: 0.45 }],
  [/^(rotor_cup_shaft|rotor_hub_shaft)/,                                       { color: 0xa4a9af, metalness: 0.95, roughness: 0.32 }],
  [/^(stage2_thrust|rotor_bearing)/,                                           { color: 0xb3893c, metalness: 1.00, roughness: 0.36 }],
  [/^(cross_roller_inner_ring|cross_roller_outer_ring)/,                       { color: 0xd6d9dc, metalness: 1.00, roughness: 0.22 }],
  [/^(stage\d_|ring_gear|cross_roller_rollers|carrier2_posts)/,               { color: 0xc6cacf, metalness: 1.00, roughness: 0.28 }],
  [/^(carrier1_plate_B_sun2_spur)/,                                            { color: 0x7d838a, metalness: 1.00, roughness: 0.32 }],
  [/^(housing_|rear_cover|rear_bulkhead|front_bulkhead|front_ring_alu|carrier2_plate|output_hub_flange|front_seal)/, { color: 0x3a3f45, metalness: 0.85, roughness: 0.40 }],
];
function applyLook(name, mat) {
  const hit = LOOK.find(([re]) => re.test(name));
  const p = hit ? hit[1] : { color: 0x3a3f45, metalness: 0.85, roughness: 0.40 };
  mat.color.setHex(p.color); mat.metalness = p.metalness; mat.roughness = p.roughness; mat.envMapIntensity = 1.1;
}
const loader = new GLTFLoader();
let root = null, parts = [], length = 70, state = { size: 's', rotor: 'out' };   // outer-rotor models only
const cache = {};
const loadEl = document.getElementById('load'), hintEl = document.getElementById('hint');
const slider = document.getElementById('explode');

async function load() {
  const url = `models/stampede_${state.size}_${state.rotor}.${MODEL_EXT}`;
  loadEl.classList.remove('hide'); loadEl.textContent = 'LOADING MODEL';
  let gltf = cache[url];
  if (!gltf) { try { gltf = await loader.loadAsync(url); cache[url] = gltf; } catch (e) { loadEl.textContent = 'MODEL NOT FOUND · ' + url; return; } }
  if (root) scene.remove(root);
  root = new THREE.Group();
  const model = gltf.scene.clone(true);
  // orient: file z axis (actuator axis) -> world x, so it lies horizontally; rear at left, output at right
  model.rotation.set(0, Math.PI / 2, 0);
  root.add(model);
  // measure
  const box = new THREE.Box3().setFromObject(model); const size = new THREE.Vector3(); box.getSize(size); const center = new THREE.Vector3(); box.getCenter(center);
  model.position.sub(center); length = size.x;
  // collect parts with group index
  parts = [];
  const meshes = []; model.traverse(o => { if (o.isMesh) meshes.push(o); });
  const groupZ = new Map();
  meshes.forEach(m => {
    const name = m.name || (m.parent && m.parent.name) || '';
    let gi = GROUPS.findIndex(([, re]) => re.test(name));
    const b = new THREE.Box3().setFromObject(m); const c = new THREE.Vector3(); b.getCenter(c);
    if (gi < 0) gi = -1;
    m.userData.base = m.position.clone(); m.userData.cx = c.x; m.userData.gi = gi; m.userData.label = prettyName(name);
    m.material = m.material.clone(); applyLook(name, m.material);
    m.castShadow = false;
    parts.push(m);
    if (gi >= 0) { const a = groupZ.get(gi) || []; a.push(c.x); groupZ.set(gi, a); }
  });
  // order groups by their mean position along the axis so unknown variants still explode sensibly
  const order = [...groupZ.entries()].map(([gi, xs]) => [gi, xs.reduce((s, v) => s + v, 0) / xs.length]).sort((a, b) => a[1] - b[1]);
  const rank = new Map(order.map(([gi], i) => [gi, i]));
  const housingRank = rank.get(5) ?? Math.floor(order.length / 2);
  parts.forEach(m => { const r = m.userData.gi >= 0 ? rank.get(m.userData.gi) : null; m.userData.step = r == null ? 0 : (r - housingRank); });
  root.userData.meanStep = (order.length - 1) / 2 - housingRank;
  scene.add(root);
  disc.scale.set(length * 3.2, length * 3.2, 1); disc.position.y = -size.y * 0.62;
  applyExplode(); frame(true);
  loadEl.classList.add('hide');
  hintEl.classList.remove('hide'); setTimeout(() => hintEl.classList.add('hide'), 2600);
}
let lastT = 0;
function applyExplode() {
  const t = parseFloat(slider.value); const step = length * 0.2 * t; // spacing between assemblies, in model units
  // pull the camera back as the assembly spreads out, keeping the current orbit direction
  const k = (1 + 1.15 * t) / (1 + 1.15 * lastT); lastT = t;
  const dir = camera.position.clone().sub(controls.target); camera.position.copy(controls.target).add(dir.multiplyScalar(k));
  const q = new THREE.Quaternion();
  parts.forEach(m => { m.parent.getWorldQuaternion(q); const local = new THREE.Vector3(1, 0, 0).applyQuaternion(q.invert()); m.position.copy(m.userData.base).add(local.multiplyScalar(step * m.userData.step)); });
  if (root) root.position.x = -step * (root.userData.meanStep || 0);   // keep the spread centred in frame
}
function frame(reset) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dist = Math.max(length * 2.6, 180) * (h > w ? 1.6 : 1.0);
  if (reset) { lastT = parseFloat(slider.value); const k = 1 + 1.15 * lastT; camera.position.set(dist * 0.55 * k, dist * 0.38 * k, dist * 0.78 * k); controls.target.set(0, 0, 0); }
  controls.update();
}
slider.addEventListener('input', applyExplode);
document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => { state.size = b.dataset.size; document.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b)); load(); }));
const spin = document.getElementById('spin');
spin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', controls.autoRotate); });
document.getElementById('reset').addEventListener('click', () => { slider.value = 0; applyExplode(); frame(true); });
controls.addEventListener('start', () => { controls.autoRotate = false; spin.setAttribute('aria-pressed', 'false'); });

// hover / tap part name
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); const partEl = document.getElementById('partname');
function pick(ev) {
  const r = canvas.getBoundingClientRect(); ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1; ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera); const hit = ray.intersectObjects(parts, false)[0];
  partEl.textContent = hit ? hit.object.userData.label : '—';
}
canvas.addEventListener('pointermove', pick); canvas.addEventListener('pointerdown', pick);

// a gentle idle explode the first time the viewer is on screen, so visitors see what the slider does
let idle = 0, idleOn = true, visible = true;
const stageEl = document.getElementById('stage');
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);
if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; }), { threshold: 0.15 }).observe(stageEl);
resize(); load();
renderer.setAnimationLoop((t) => {
  if (!visible) return;                       // nothing to draw while scrolled out of view
  if (idleOn && root) { idle += 1 / 60; if (idle > 1.2 && idle < 4.2) { slider.value = ((idle - 1.2) / 3) * 0.6; applyExplode(); } else if (idle >= 4.2 && idle < 7.4) { slider.value = Math.max(0, 0.6 - ((idle - 4.2) / 3.2) * 0.6); applyExplode(); } else if (idle >= 7.4) idleOn = false; }
  controls.update(); renderer.render(scene, camera);
});
['pointerdown', 'wheel', 'touchstart'].forEach(e => stageEl.addEventListener(e, () => { idleOn = false; }, { passive: true }));
stageEl.addEventListener('pointerdown', () => { controls.enableZoom = true; });
stageEl.addEventListener('pointerleave', () => { controls.enableZoom = false; });
slider.addEventListener('pointerdown', () => { idleOn = false; });
</script>
</body>
</html>
